name: release

on:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: |
              8.0.x
              9.0.x
              10.0.x
            cache: true
            cache-dependency-path: '**/packages.lock.json'

        - name: Restore
          run: dotnet restore GeoTimeZone.sln --nologo --locked-mode

        - name: Run Data Builder
          run: dotnet run --project src/GeoTimeZone.DataBuilder -c Release --nologo --no-restore

        - name: Build
          run: dotnet build GeoTimeZone.sln -c Release --nologo --no-restore

        - name: Test
          run: dotnet test -c Release --no-build --report-xunit-trx

        - name: Pack
          run: dotnet pack GeoTimeZone.sln -c Release --nologo --no-build

        - name: NuGet login
          uses: NuGet/login@v1
          id: login
          with:
            user: ${{ secrets.NUGET_USER }}

        - name: Push to NuGet
          run: dotnet nuget push --skip-duplicate -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY" src/GeoTimeZone/**/*.nupkg
          env:
            NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

        - name: Archive Artifacts
          uses: actions/upload-artifact@v7
          with:
            name: nuget-packages
            path: src/**/Release/*.*nupkg
            if-no-files-found: error
